name: SCA and SBOM Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- SBOM (Syft) ---
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-file
          path: sbom.json

      # --- SCA (Trivy) ---
      - name: Run Trivy (Independent)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # --- SCA (Grype - независимо) ---
      - name: Run Grype (Independent)
        uses: anchore/scan-action@v3
        with:
          path: '.'
          fail-build: false
          output-format: 'json'
          output: 'grype-results.json'

      - name: Upload Grype Results
        uses: actions/upload-artifact@v4
        with:
          name: grype-results
          path: grype-results.json
